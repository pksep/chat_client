name: Desktop Builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag: vX.Y.Z or vX.Y.Z-beta.N'
        required: true
        type: string
      publish:
        description: 'Publish signed packages and the update feed to GitHub Releases'
        default: false
        type: boolean
      artifact_run_id:
        description: 'Optional completed Desktop Builds run for this release; reuse its signed packages'
        required: false
        type: string
      macos_arm_runner:
        description: 'Apple Silicon runner; macOS 15 can be used when the latest image is queued'
        default: macos-latest
        type: choice
        options:
          - macos-latest
          - macos-15
  push:
    tags: ['v*']
  # semantic-release uses GITHUB_TOKEN; its tags do not trigger push workflows.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  LEFTHOOK: 0

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      publish: ${{ steps.release.outputs.publish }}
      artifact_run_id: ${{ steps.release.outputs.artifact_run_id }}
      artifact_ids: ${{ steps.release.outputs.artifact_ids }}
      apple_signed: ${{ steps.release.outputs.apple_signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/github-script@v7
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          MACOS_NOTARIZATION_REQUIRED: ${{ vars.MACOS_NOTARIZATION_REQUIRED }}
          APPLE_CERTIFICATE_PRESENT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          APPLE_CERTIFICATE_PASSWORD_PRESENT: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          APPLE_SIGNING_IDENTITY_PRESENT: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          APPLE_API_ISSUER_PRESENT: ${{ secrets.APPLE_API_ISSUER != '' }}
          APPLE_API_KEY_PRESENT: ${{ secrets.APPLE_API_KEY != '' }}
          APPLE_API_PRIVATE_KEY_PRESENT: ${{ secrets.APPLE_API_PRIVATE_KEY != '' }}
        with:
          script: |
            let tag;
            if (context.eventName === 'workflow_run') {
              const { data: release } = await github.rest.repos.getLatestRelease(context.repo);
              if (Date.parse(release.published_at) < Date.parse(context.payload.workflow_run.run_started_at)) {
                core.info('No new release in this run');
                return;
              }
              tag = release.tag_name;
            } else {
              tag = context.eventName === 'push' ? context.ref.replace('refs/tags/', '') : process.env.INPUT_TAG;
            }
            if (!/^v\d+\.\d+\.\d+(-beta\.\d+)?$/.test(tag)) throw new Error('Invalid desktop release tag');
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: tag });
            if (context.eventName === 'workflow_run' && commit.sha !== context.payload.workflow_run.head_sha && !commit.parents.some(parent => parent.sha === context.payload.workflow_run.head_sha)) {
              core.info('Latest release belongs to a different workflow run');
              return;
            }
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { appleSecrets, appleSigningMode, requireVerifiedMacJobs } = await import(pathToFileURL(resolve('.github/scripts/macos-distribution.mjs')).href);
            const present = appleSecrets.filter(name => process.env[`${name}_PRESENT`] === 'true');
            const appleSigned = appleSigningMode(present, process.env.MACOS_NOTARIZATION_REQUIRED === 'true') === 'notarized';
            core.setOutput('apple_signed', appleSigned);
            if (!appleSigned) core.notice('Apple Developer ID не настроен: macOS-пакеты требуют ручного разрешения Gatekeeper. Инструкция: doc/macos-distribution.md');
            const artifactRunId = process.env.INPUT_ARTIFACT_RUN_ID?.trim();
            if (artifactRunId) {
              if (!/^\d+$/.test(artifactRunId)) throw new Error('Invalid artifact run ID');
              const { data: source } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: artifactRunId });
              if (source.status !== 'completed' || source.path !== '.github/workflows/desktop-builds.yml' || source.head_sha !== commit.sha) {
                throw new Error('Packages must come from a completed Desktop Builds run at this release tag');
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id: artifactRunId, filter: 'all' });
              const buildNames = ['Build Windows x64', 'Build Linux x64', 'Build macOS Apple Silicon', 'Build macOS Intel'];
              if (!buildNames.every(name => jobs.some(job => job.name === name && job.conclusion === 'success'))) {
                throw new Error('All four platform builds must have succeeded');
              }
              if (appleSigned) requireVerifiedMacJobs(jobs);
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: artifactRunId });
              const names = ['desktop-windows-x86_64', 'desktop-linux-x86_64', 'desktop-darwin-aarch64', 'desktop-darwin-x86_64'];
              const packages = names.map(name => {
                const matches = artifacts.filter(artifact => artifact.name === name && !artifact.expired);
                if (matches.length !== 1) throw new Error(`Missing or ambiguous artifact: ${name}`);
                return matches[0].id;
              });
              core.setOutput('artifact_run_id', artifactRunId);
              core.setOutput('artifact_ids', packages.join(','));
            }
            core.setOutput('tag', tag);
            core.setOutput('version', tag.slice(1));
            core.setOutput('channel', tag.includes('-beta.') ? 'beta' : 'stable');
            core.setOutput('publish', context.eventName !== 'workflow_dispatch' || process.env.INPUT_PUBLISH === 'true');

  build-tauri:
    needs: prepare
    if: needs.prepare.outputs.tag != '' && needs.prepare.outputs.artifact_run_id == ''
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            args: '--bundles nsis,msi'
            rust_target: ''
            platform: windows-x86_64
          - label: Linux x64
            os: ubuntu-22.04
            args: '--bundles appimage,deb,rpm'
            rust_target: ''
            platform: linux-x86_64
          - label: macOS Apple Silicon
            os: ${{ inputs.macos_arm_runner || 'macos-latest' }}
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            rust_target: aarch64-apple-darwin
            platform: darwin-aarch64
          - label: macOS Intel
            os: macos-15-intel
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            rust_target: x86_64-apple-darwin
            platform: darwin-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libasound2-dev librsvg2-dev patchelf clang libclang-dev cmake pkg-config libunwind-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-nice gstreamer1.0-pulseaudio gstreamer1.0-tools
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}
      - name: Identify macOS SDK for the Rust cache
        if: runner.os == 'macOS'
        id: macos_toolchain
        # Тег повторного выпуска может быть старше вспомогательного CI-скрипта.
        run: |
          identity="$RUNNER_TEMP/chat-xcode-cache.txt"
          xcodebuild -version > "$identity"
          xcode-select -p >> "$identity"
          xcrun --sdk macosx --show-sdk-path >> "$identity"
          key="$(shasum -a 256 "$identity" | cut -d ' ' -f 1)"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: ${{ runner.os == 'macOS' && format('v1-rust-{0}', steps.macos_toolchain.outputs.key) || 'v0-rust' }}
      - run: bun install --frozen-lockfile
      - name: Prepare Apple notarization credentials
        id: apple_signing
        if: runner.os == 'macOS' && needs.prepare.outputs.apple_signed == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bun .github/scripts/macos-distribution.mjs prepare
      - name: Build release and sign updater packages
        if: runner.os != 'macOS' || needs.prepare.outputs.apple_signed != 'true'
        env:
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GSTREAMER_INCLUDE_BAD_PLUGINS: '1'
        run: bun run tauri:build -- ${{ matrix.args }}
      - name: Build Apple signed and notarized release
        if: runner.os == 'macOS' && needs.prepare.outputs.apple_signed == 'true'
        env:
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.apple_signing.outputs.key_file }}
        run: bun run tauri:build -- ${{ matrix.args }}
      - name: Verify Windows shortcut migration and recovery
        if: runner.os == 'Windows'
        run: bun scripts/test-windows-shortcuts.ts
      - name: Verify Windows agent exit and installer file replacement
        if: runner.os == 'Windows'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --test desktop_agent_process --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/test-windows-agent-installer.ts
      - name: Verify Apple signatures, notarization and Gatekeeper
        if: runner.os == 'macOS' && needs.prepare.outputs.apple_signed == 'true'
        env:
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.apple_signing.outputs.key_file }}
        run: bun .github/scripts/macos-distribution.mjs verify ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && needs.prepare.outputs.apple_signed == 'true'
        with:
          name: apple-distribution-${{ matrix.platform }}
          path: test-results/apple-distribution-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect packages and signatures
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: bun scripts/desktop-release.ts collect src-tauri/target/${{ matrix.rust_target }}/release/bundle desktop-packages ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop-packages/
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - name: Verify native macOS update, relaunch and Dock reopen
        if: runner.os == 'macOS'
        run: bun scripts/test-desktop-updater-macos-native.ts
      - name: Verify macOS dialog layout in WebKit
        if: runner.os == 'macOS'
        run: |
          bunx playwright install webkit
          bunx playwright test e2e/creation-modal-desktop.spec.ts e2e/forward-modal-desktop.spec.ts e2e/macos-desktop.spec.ts e2e/macos-form-styles.spec.ts e2e/image-editor-desktop.spec.ts e2e/file-download-cancel.spec.ts e2e/pinned-messages-list.spec.ts e2e/compact-call-layout.spec.ts --project=webkit-desktop --workers=1 --reporter=line --output=test-results/dialog-layout
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: dialog-layout-${{ matrix.platform }}
          path: |
            test-results/**/creation-modal.png
            test-results/**/forward-modal.png
            test-results/**/error-context.md
            test-results/**/trace.zip
            test-results/**/pin-layout.*
            test-results/**/pin-navigation.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: native-updater-smoke-${{ matrix.platform }}
          path: test-results/macos-updater-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean Apple signing material
        if: always() && runner.os == 'macOS' && steps.apple_signing.outputs.key_dir != ''
        env:
          SIGNING_DIRECTORY: ${{ steps.apple_signing.outputs.key_dir }}
        run: bun .github/scripts/macos-distribution.mjs cleanup

  linux-media:
    needs: [prepare, build-tauri]
    if: ${{ !cancelled() && needs.prepare.outputs.tag != '' && (needs.build-tauri.result == 'success' || (needs.build-tauri.result == 'skipped' && needs.prepare.outputs.artifact_run_id != '')) }}
    name: Linux media (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04']
    steps:
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates git build-essential pkg-config libunwind-dev libgstreamer1.0-dev gstreamer1.0-plugins-good
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-x86_64
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.artifact_run_id || github.run_id }}
          path: linux-packages
      - name: Verify bundled multimedia independently of host GStreamer
        shell: bash
        run: |
          mapfile -d '' packages < <(find linux-packages -type f -name '*.AppImage' -print0)
          test "${#packages[@]}" -eq 1
          bash .github/scripts/check-linux-media.sh "${packages[0]}"

  publish:
    needs: [prepare, build-tauri, linux-media]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.tag != '' && needs.linux-media.result == 'success' && (needs.build-tauri.result == 'success' || (needs.build-tauri.result == 'skipped' && needs.prepare.outputs.artifact_run_id != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          artifact-ids: ${{ needs.prepare.outputs.artifact_ids }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.artifact_run_id || github.run_id }}
          merge-multiple: true
          path: desktop-upload/packages
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.apple_signed == 'true'
        with:
          pattern: apple-distribution-*
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.artifact_run_id || github.run_id }}
          merge-multiple: true
          path: desktop-upload/apple-reports
      - name: Require Apple distribution verification
        if: needs.prepare.outputs.apple_signed == 'true'
        env:
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bun -e '
            import { verifyDistributionReport } from "./.github/scripts/macos-distribution.mjs";
            for (const platform of ["darwin-aarch64", "darwin-x86_64"]) {
              const report = await Bun.file(`desktop-upload/apple-reports/apple-distribution-${platform}.json`).json();
              verifyDistributionReport(report, platform, process.env.DESKTOP_VERSION);
            }
          '
      - name: Create complete update manifest
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          bun -e '
            import { readdir, readFile } from "node:fs/promises";
            import { updaterFileFor, verifyDesktopArtifact } from "./scripts/desktop-release.ts";
            for (const target of ["windows-x86_64", "linux-x86_64", "darwin-aarch64", "darwin-x86_64"]) {
              const directory = `desktop-upload/packages/${target}`;
              const file = `${directory}/${updaterFileFor(target, await readdir(directory))}`;
              await verifyDesktopArtifact(file, await readFile(`${file}.sig`, "utf8"), process.env.TAURI_UPDATER_PUBKEY);
            }
          '
          bun scripts/desktop-release.ts manifest desktop-upload/packages desktop-upload/publish '${{ needs.prepare.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ needs.prepare.outputs.version }}
          path: desktop-upload/
          overwrite: true
          retention-days: 30
      - name: Attach signed installers to the GitHub release
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const { readFile, readdir } = require('node:fs/promises');
            const { createHash } = require('node:crypto');
            const assetNames = JSON.parse(await readFile('desktop-upload/publish/asset-names.json', 'utf8'));
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.RELEASE_TAG });
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id: release.id });
            for (const target of ['windows-x86_64', 'linux-x86_64', 'darwin-aarch64', 'darwin-x86_64']) {
              const directory = `desktop-upload/packages/${target}`;
              for (const file of await readdir(directory)) {
                const name = assetNames[`${target}/${file}`];
                if (!name) throw new Error(`Missing asset name: ${target}/${file}`);
                const data = await readFile(`${directory}/${file}`);
                const digest = `sha256:${createHash('sha256').update(data).digest('hex')}`;
                const asset = existing.find(asset => asset.name === name);
                if (asset) {
                  if (asset.digest !== digest) throw new Error(`Different release asset already exists: ${name}`);
                  core.info(`Already published: ${name}`);
                  continue;
                }
                await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id: release.id, name, data });
                core.info(`Published: ${name}`);
              }
            }
      - name: Publish the GitHub update feed after all installers
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        with:
          script: |
            const { readFile } = require('node:fs/promises');
            const { createHash } = require('node:crypto');
            const channel = process.env.RELEASE_CHANNEL;
            const tag = `desktop-${channel}`;
            const data = await readFile(`desktop-upload/publish/${channel}/latest.json`);
            const manifest = JSON.parse(data);
            for (const platform of Object.values(manifest.platforms)) {
              const response = await fetch(platform.url, { method: 'HEAD' });
              if (!response.ok) throw new Error(`Download HTTP ${response.status}: ${platform.url}`);
            }
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.payload.repository.default_branch,
                name: `Desktop updater feed (${channel})`, prerelease: true, make_latest: 'false',
                body: 'Служебный канал обновлений Tauri. Установщики находятся в релизах vX.Y.Z.'
              }));
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id: release.id });
            const previous = assets.find(asset => asset.name === 'latest.json');
            const digest = `sha256:${createHash('sha256').update(data).digest('hex')}`;
            if (previous?.digest === digest) {
              core.info('Update feed is already published');
              return;
            }
            if (previous) await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: previous.id });
            await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id: release.id, name: 'latest.json', data });
      - name: Verify public manifest and download URLs
        if: needs.prepare.outputs.publish == 'true'
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          bun -e '
            const url = `https://github.com/pksep/chat_client/releases/download/desktop-${process.env.RELEASE_CHANNEL}/latest.json?verify=${Date.now()}`;
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) throw new Error(`Manifest HTTP ${response.status}`);
            const manifest = await response.json();
            if (manifest.version !== process.env.EXPECTED_VERSION) throw new Error("Wrong public version");
            for (const platform of Object.values(manifest.platforms)) {
              const result = await fetch(platform.url, { method: "HEAD" });
              if (!result.ok) throw new Error(`Download HTTP ${result.status}`);
            }
          '
      - name: Remove temporary artifacts after verified publication
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ needs.prepare.outputs.artifact_run_id }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const names = new Set([
              'desktop-windows-x86_64', 'desktop-linux-x86_64',
              'desktop-darwin-aarch64', 'desktop-darwin-x86_64',
              `desktop-release-${process.env.RELEASE_VERSION}`
            ]);
            const runs = new Set([String(context.runId), process.env.SOURCE_RUN_ID].filter(Boolean));
            for (const run_id of runs) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id });
              for (const artifact of artifacts.filter(artifact => names.has(artifact.name))) {
                await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: artifact.id });
                core.info(`Removed temporary artifact: ${artifact.name}`);
              }
            }
