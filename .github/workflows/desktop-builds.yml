name: Desktop Builds

env:
  LEFTHOOK: 0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            args: ''
            rust_target: ''
            artifact_name: sep-chat-windows-x64
          - label: Linux x64
            os: ubuntu-22.04
            args: ''
            rust_target: ''
            artifact_name: sep-chat-linux-x64
          - label: macOS Apple Silicon
            os: macos-latest
            args: '--target aarch64-apple-darwin --bundles app'
            rust_target: aarch64-apple-darwin
            artifact_name: sep-chat-macos-arm64
          - label: macOS Intel
            os: macos-latest
            args: '--target x86_64-apple-darwin --bundles app'
            rust_target: x86_64-apple-darwin
            artifact_name: sep-chat-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libasound2-dev \
            librsvg2-dev \
            patchelf \
            clang \
            libclang-dev \
            cmake \
            pkg-config

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set desktop version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/setDesktopVersion.mjs ${{ github.ref_name }}

      - name: Configure Tauri updater
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: node scripts/configureTauriUpdater.mjs

      - name: Build and publish Tauri app
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SEP Chat ${{ github.ref_name }}'
          releaseBody: 'Desktop builds and updater artifacts.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          tauriScript: bun run tauri
          args: ${{ matrix.args }}

      - name: Build Tauri app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: bun run tauri:build -- ${{ matrix.args }}

      - name: Upload bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.app
          if-no-files-found: error

  publish-updater-json:
    name: Publish updater manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publishTauriLatestJson.mjs
