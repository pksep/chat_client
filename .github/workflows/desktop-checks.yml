name: Desktop Checks

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-*.yml'
      - '.github/scripts/macos-distribution.mjs'
      - '.github/scripts/macos-cache-key.sh'
      - '.github/scripts/check-linux-media.sh'
      - '.github/scripts/linux-media-probe.c'
      - 'src-tauri/**'
      - 'src/services/*desktop*'
      - 'src/services/desktop-storage-settle.ts'
      - 'src/services/useDesktopUpdater.ts'
      - 'src/composables/useMobileApp.ts'
      - 'src/components/Menu/*Update*.vue'
      - 'src/components/Menu/MenuProfilePanel.vue'
      - 'src/components/Desktop/**'
      - 'src/assets/desktop-shell.css'
      - 'src/assets/menu-navigation.css'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/build-desktop.ts'
      - 'scripts/desktop-release.ts'
      - 'scripts/test-desktop-updater-macos-native.ts'
      - 'scripts/test-desktop-native-smoke.ts'
      - 'scripts/test-windows-shortcuts.ts'
      - 'test/fixtures/windows-shortcuts.nsi'
      - 'scripts/desktop-shell-source.mjs'
      - 'e2e/fixtures/desktop-updater-native.ts'
      - 'deploy/**'
      - 'nginx.conf'
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      ui_only:
        description: 'Run macOS WebKit UI checks without building installers'
        default: false
        type: boolean
      test_filter:
        description: 'Optional Playwright test name pattern for UI checks'
        default: ''
        type: string
      call_native_only:
        description: 'Check real call windows on Windows, macOS and Linux without publishing'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: 0
  DESKTOP_VERSION: '0.0.0-beta.0'

jobs:
  build:
    if: inputs.ui_only != true && inputs.call_native_only != true
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            args: '--bundles nsis'
            rust_target: ''
            platform: windows-x86_64
          - label: Linux x64
            os: ubuntu-22.04
            args: '--bundles appimage'
            rust_target: ''
            platform: linux-x86_64
          - label: macOS Apple Silicon
            os: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            rust_target: aarch64-apple-darwin
            platform: darwin-aarch64
          - label: macOS Intel
            os: macos-15-intel
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            rust_target: x86_64-apple-darwin
            platform: darwin-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libasound2-dev librsvg2-dev patchelf clang libclang-dev cmake pkg-config libunwind-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-nice gstreamer1.0-pulseaudio gstreamer1.0-tools
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}
      - name: Identify macOS SDK for the Rust cache
        if: runner.os == 'macOS'
        id: macos_toolchain
        run: bash .github/scripts/macos-cache-key.sh
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: ${{ runner.os == 'macOS' && format('v1-rust-{0}', steps.macos_toolchain.outputs.key) || 'v0-rust' }}
      - run: bun install --frozen-lockfile
      - name: Verify update logic
        run: bun test ./test/desktopUpdater.test.ts ./test/desktopRelease.test.ts ./test/macosDistribution.test.ts
      # Проверяем упаковку всех платформ до релиза; ключей подписи и публикации нет.
      - name: Build preview installer
        env:
          GSTREAMER_INCLUDE_BAD_PLUGINS: '1'
        run: bun run tauri:build -- --bootstrap ${{ matrix.args }}
      - name: Verify Windows shortcut migration and recovery
        if: runner.os == 'Windows'
        run: bun scripts/test-windows-shortcuts.ts
      - name: Verify native macOS update, relaunch and Dock reopen
        if: runner.os == 'macOS'
        run: bun scripts/test-desktop-updater-macos-native.ts
      - name: Verify AppImage media plugins
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mapfile -d '' packages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print0)
          test "${#packages[@]}" -eq 1
          bash .github/scripts/check-linux-media.sh "${packages[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-preview-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*-setup.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  call-native:
    if: github.event_name == 'workflow_dispatch' && inputs.call_native_only == true
    name: Call window (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: macOS-ARM, os: macos-latest, session: desktop }
          - { label: macOS-Intel, os: macos-15-intel, session: desktop }
          - { label: Linux-X11, os: ubuntu-24.04, session: x11 }
          - { label: Linux-Wayland, os: ubuntu-24.04, session: wayland }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: call-native-${{ matrix.label }}
          cache-on-failure: true
      - name: Install Linux runtime
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libasound2-dev librsvg2-dev clang libclang-dev cmake pkg-config libunwind-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good xvfb openbox weston dbus-x11 wmctrl x11-utils
      - run: bun install --frozen-lockfile
      - name: Check native desktop
        if: runner.os != 'Linux'
        run: bun scripts/test-desktop-call-portability.ts
      - name: Check X11 call window
        if: matrix.session == 'x11'
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' bash -c '
            openbox >/tmp/call-openbox.log 2>&1 &
            sleep .5
            xprop -root _NET_SUPPORTING_WM_CHECK
            GDK_BACKEND=x11 bun scripts/test-desktop-call-portability.ts
            result=$?
            cat /tmp/call-openbox.log
            exit $result
          '
      - name: Check Wayland call window
        if: matrix.session == 'wayland'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' bash -c '
            trap "cat /tmp/call-weston.log" EXIT
            weston --backend=x11-backend.so --use-pixman --socket=wayland-qa --width=1600 --height=1200 --idle-time=0 >/tmp/call-weston.log 2>&1 &
            for attempt in {1..50}; do test -S "$XDG_RUNTIME_DIR/wayland-qa" && break; sleep .1; done
            export WAYLAND_DISPLAY=wayland-qa GDK_BACKEND=wayland
            dbus-update-activation-environment DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR
            WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1 RUST_BACKTRACE=1 bun scripts/test-desktop-call-portability.ts
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: call-native-${{ matrix.label }}
          path: |
            test-results-native/call-portability-*/report.json
            test-results-native/call-portability-*/native-call.png
          if-no-files-found: warn
          retention-days: 7

  macos-ui:
    name: WebKit UI (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.ui_only == true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install webkit
      - name: Verify dialog layout and pinned navigation
        env:
          UI_TEST_FILTER: ${{ inputs.test_filter }}
        run: bunx playwright test e2e/creation-modal-desktop.spec.ts e2e/forward-modal-desktop.spec.ts e2e/macos-desktop.spec.ts e2e/macos-form-styles.spec.ts e2e/image-editor-desktop.spec.ts e2e/file-download-cancel.spec.ts e2e/pinned-messages-list.spec.ts --project=webkit-desktop --workers=1 --reporter=line --trace=retain-on-failure --grep "$UI_TEST_FILTER" --output=test-results/dialog-layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-ui-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
