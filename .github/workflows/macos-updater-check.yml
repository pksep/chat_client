name: macOS Updater Check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEFTHOOK: 0

jobs:
  check:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Intel immediate
            os: macos-15-intel
            target: x86_64-apple-darwin
            settle: '0'
          - label: Intel settled
            os: macos-15-intel
            target: x86_64-apple-darwin
            settle: '2000'
          - label: Apple Silicon immediate
            os: macos-latest
            target: aarch64-apple-darwin
            settle: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Verify native update and storage
        env:
          QA_STORAGE_SETTLE_MS: ${{ matrix.settle }}
        run: bun scripts/test-desktop-updater-macos-native.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-${{ matrix.label }}
          path: test-results/macos-updater-*.json
          if-no-files-found: ignore
