apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sep-chat-desktop-updates
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sep-chat-desktop-updates
data:
  default.conf: |
    server {
      listen 80;
      root /srv;
      location = /healthz { return 200 'ok'; }
      location ~ ^/desktop/(stable|beta)/latest\.json$ {
        default_type application/json;
        add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
        try_files $uri =404;
      }
      location /desktop/releases/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
      }
      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sep-chat-desktop-updates
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sep-chat-desktop-updates
  template:
    metadata:
      labels:
        app: sep-chat-desktop-updates
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
          volumeMounts:
            - { name: packages, mountPath: /srv/desktop }
            - { name: config, mountPath: /etc/nginx/conf.d, readOnly: true }
      volumes:
        - name: packages
          persistentVolumeClaim:
            claimName: sep-chat-desktop-updates
        - name: config
          configMap:
            name: sep-chat-desktop-updates
---
apiVersion: v1
kind: Service
metadata:
  name: sep-chat-desktop-updates
spec:
  selector:
    app: sep-chat-desktop-updates
  ports:
    - { port: 80, targetPort: 80 }
