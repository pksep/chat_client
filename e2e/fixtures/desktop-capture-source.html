<!doctype html>
<html lang="ru">
  <meta charset="utf-8" />
  <title>SEP Capture QA</title>
  <style>body { margin: 0; overflow: hidden; } canvas { width: 100vw; height: 100vh; display: block; }</style>
  <canvas width="1280" height="720"></canvas>
  <script>
    document.title = new URLSearchParams(location.search).get('title') || 'SEP Capture QA';
    const canvas = document.querySelector('canvas');
    const context = canvas.getContext('2d');
    let frame = 0;
    function draw() {
      context.fillStyle = ++frame % 60 < 30 ? '#2675ed' : '#20b789';
      context.fillRect(0, 0, 1280, 720);
      context.fillStyle = '#fff';
      context.font = '36px sans-serif';
      context.fillText('SEP Chat — проверка демонстрации', 80, 100);
      context.fillText(String(frame), 80, 160);
      context.fillRect(80 + frame % 1000, 300, 80, 80);
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</html>
