<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Проверка ИИ и стикеров</title>
  </head>
  <body>
    <script>
      const report = value =>
        fetch('http://127.0.0.1:5213/report', {
          method: 'POST',
          body: JSON.stringify(value)
        });
      window.addEventListener('error', e =>
        report({ passed: false, error: e.message })
      );
      window.addEventListener('unhandledrejection', e =>
        report({ passed: false, error: String(e.reason) })
      );
      setTimeout(
        () =>
          report({
            passed: false,
            error: 'Не загрузилась проверка интерфейса'
          }),
        60000
      );
    </script>
    <script type="module">
      import { createPinia, setActivePinia } from 'pinia';
      import { checkDesktopUiRegressions } from './desktop-ui-regressions';
      import { setConfig } from '../../src/services/useConfig';
      setActivePinia(createPinia());
      setConfig({ CHAT_API_DOMAIN: location.origin + '/synthetic-only' });
      try {
        await checkDesktopUiRegressions();
        await report({
          step: 'complete',
          passed: true,
          scenario: 'native-ai-default-and-first-sticker-click'
        });
      } catch (error) {
        await report({ passed: false, error: String(error) });
      }
    </script>
  </body>
</html>
