<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/images/sep-chat-logo.svg?v=20260731" />
  <link rel="alternate icon" href="/images/favicon.ico?v=20260731" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-180x180.png?v=20260731" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#f8f9fd" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: http: https: ws: wss: capacitor:; img-src 'self' data: blob: http: https: file: capacitor:; media-src 'self' data: blob: http: https: file: capacitor:; font-src 'self' data: http: https:; worker-src 'self' blob:; frame-src 'self' blob: http: https:; manifest-src 'self'" />
  <title>SEP:Chat</title>
  <script type="module" src="/src/startup.ts"></script>
  <style>
    @import url('@pksep/yui/styles');


    html,
    body,
    #app {
      min-height: 100%;
      margin: 0;
      background: var(--surface-main);
      transition: all 0.2s ease;
    }

    .startup-shell {
      position: fixed;
      inset: 0;
      z-index: 2600;
      display: grid;
      grid-template-columns: 345px minmax(0, 1fr);
      height: 100dvh;
      min-height: 100dvh;
      background: var(--surface-main);
      color: #111827;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      transition:
        all 0.2s ease opacity 180ms ease,
        visibility 180ms ease;
    }

    .startup-shell--leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .startup-shell__content {
      display: grid;
      grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      padding: 20px 10px 0;
      border-right: 0.5px solid var(--border-table);
      background: var(--surface-input-primary);
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .startup-shell__toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 24px;
      padding: 0 16px 10px;
    }

    .startup-shell__title {
      width: 104px;
      height: 24px;
      border-radius: 6px;
    }

    .startup-shell__create {
      width: 22px;
      height: 22px;
      border-radius: 50%;
    }

    .startup-shell__divider {
      height: 1px;
      margin: 0 10px 10px;
      background: var(--surface-overlay);
      transition: all 0.2s ease;
    }

    .startup-shell__search {
      height: 40px;
      margin: 0 10px 10px;
      border-radius: 8px;
      background: var(--surface-overlay);
      transition: all 0.2s ease;
    }

    .startup-shell__filters {
      display: flex;
      gap: 5px;
      min-height: 43px;
      padding: 0 10px 10px;
      box-sizing: border-box;
    }

    .startup-shell__chip {
      width: 70px;
      height: 33px;
      border-radius: 15px;
      background: var(--surface-overlay);
      border: 1px solid var(--border-table);
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .startup-shell__chip:nth-child(2) {
      width: 58px;
      background: var(--surface-input-primary);
      border-color: var(--border-table);
      transition: all 0.2s ease;
    }

    .startup-shell__chip:nth-child(3) {
      width: 96px;
      background: var(--surface-input-primary);
      border-color: var(--border-table);
      transition: all 0.2s ease;
    }

    .startup-shell__chip:nth-child(4) {
      width: 64px;
      background: var(--surface-input-primary);
      border-color: var(--border-table);
      transition: all 0.2s ease;
    }

    .startup-shell__list {
      min-height: 0;
      overflow: hidden;
    }

    .startup-shell__row {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr);
      column-gap: 10px;
      align-items: center;
      min-height: 60px;
      padding: 0 10px;
      box-sizing: border-box;
    }

    .startup-shell__title,
    .startup-shell__create,
    .startup-shell__avatar,
    .startup-shell__line,
    .startup-shell__subline,
    .startup-shell__nav-item,
    .startup-shell__header-avatar,
    .startup-shell__header-line,
    .startup-shell__header-subline,
    .startup-shell__header-action,
    .startup-shell__message-avatar,
    .startup-shell__message-bubble,
    .startup-shell__composer-text,
    .startup-shell__composer-toolbar-button {
      background: linear-gradient(90deg, var(--border-table), var(--action-disabled-bg), var(--border-table));
      background-size: 180% 100%;
      animation: startup-pulse 2.4s ease-in-out infinite;
      transition: all 0.2s ease;
    }

    .startup-shell__avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
    }

    .startup-shell__line {
      width: 78%;
      height: 14px;
      margin-bottom: 9px;
      border-radius: 6px;
    }

    .startup-shell__subline {
      width: 54%;
      height: 12px;
      border-radius: 6px;
    }

    .startup-shell__navigation {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      gap: 12px;
      height: 58px;
      margin: 0 -10px;
      padding: 10px 28px;
      border-top: 1px solid var(--border-table);
      border-radius: 15px 15px 0 0;
      box-shadow: 0 0 22px rgb(0 0 0 / 7%);
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .startup-shell__nav-item {
      width: 38px;
      height: 38px;
      justify-self: center;
      border-radius: 50%;
    }

    .startup-shell__main {
      display: grid;
      grid-template-rows: 60px minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
    }

    .startup-shell__header {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 7px 16px;
      border-bottom: 0.5px solid var(--border-table);
      background: var(--surface-input-primary);
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .startup-shell__header-avatar {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .startup-shell__header-profile {
      flex: 1;
      min-width: 0;
    }

    .startup-shell__header-line {
      width: 150px;
      height: 14px;
      margin-bottom: 6px;
      border-radius: 5px;
    }

    .startup-shell__header-subline {
      width: 92px;
      height: 10px;
      border-radius: 5px;
    }

    .startup-shell__header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .startup-shell__header-action {
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }

    .startup-shell__messages {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 12px;
      min-height: 0;
      padding: 22px 18px 16px;
      overflow: hidden;
      box-sizing: border-box;
    }

    .startup-shell__message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      width: 100%;
    }

    .startup-shell__message-row--outgoing {
      justify-content: flex-end;
    }

    .startup-shell__message-avatar {
      flex: 0 0 35px;
      width: 35px;
      height: 35px;
      border-radius: 50%;
    }

    .startup-shell__message-bubble {
      width: min(42%, 320px);
      height: 42px;
      border-radius: 18px 18px 18px 6px;
    }

    .startup-shell__message-row--outgoing .startup-shell__message-bubble {
      width: min(36%, 280px);
      border-radius: 18px 18px 6px 18px;
      background-color: var(--surface-overlay);
      transition: all 0.2s ease;
    }

    .startup-shell__message-bubble--short {
      width: min(28%, 210px);
    }

    .startup-shell__message-bubble--wide {
      width: min(52%, 390px);
      height: 54px;
    }

    .startup-shell__composer {
      padding: 0 10px 15px 15px;
      box-sizing: border-box;
    }

    .startup-shell__composer-editor {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-height: 105px;
      border: 0.5px solid var(--border-table);
      border-radius: 20px;
      background: var(--surface-input-primary);
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .startup-shell__composer-text {
      width: min(36%, 260px);
      height: 14px;
      margin: 20px 16px;
      border-radius: 5px;
    }

    .startup-shell__composer-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      margin: 0 16px 16px;
    }

    .startup-shell__composer-toolbar-button {
      width: 30px;
      height: 30px;
      border-radius: 7px;
    }

    .startup-shell__composer-toolbar-button:last-child {
      margin-left: auto;
      background-color: var(--surface-overlay);
      transition: all 0.2s ease;
    }

    @media screen and (width <=768px) {
      .startup-shell {
        grid-template-columns: minmax(0, 1fr);
        height: 100dvh;
      }

      .startup-shell__content {
        display: grid;
        grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
        min-height: 100dvh;
        padding: 10px 0 0;
        border-right: 0;
        background: var(--surface-input-primary);
        transition: all 0.2s ease;
      }

      .startup-shell__toolbar {
        display: flex;
        min-height: 24px;
        padding: 0 16px 10px;
      }

      .startup-shell__title {
        width: 58px;
        height: 24px;
        margin: 0;
        border-radius: 6px;
      }

      .startup-shell__main {
        display: none;
      }

      .startup-shell__divider {
        margin: 0 0 10px;
      }

      .startup-shell__search {
        height: 40px;
        margin: 0 16px 10px;
        border-radius: 8px;
      }

      .startup-shell__filters {
        gap: 5px;
        min-height: 43px;
        margin: 0;
        padding: 0 16px 10px;
      }

      .startup-shell__chip {
        width: 50px;
        height: 33px;
        border-radius: 15px;
      }

      .startup-shell__chip:nth-child(2) {
        width: 60px;
      }

      .startup-shell__chip:nth-child(3) {
        width: 78px;
      }

      .startup-shell__chip:nth-child(4) {
        width: 62px;
      }

      .startup-shell__row {
        grid-template-columns: 60px minmax(0, 1fr);
        column-gap: 10px;
        height: 82px;
        padding: 0 16px;
      }

      .startup-shell__row>div:last-child {
        display: grid;
        align-content: center;
        height: 100%;
        border-bottom: 1px solid var(--border-table);
        box-sizing: border-box;
        transition: all 0.2s ease;
      }

      .startup-shell__avatar {
        width: 60px;
        height: 60px;
      }

      .startup-shell__line {
        height: 20px;
        margin-bottom: 12px;
      }

      .startup-shell__subline {
        width: 92%;
        height: 18px;
      }

      .startup-shell__navigation {
        height: calc(58px + env(safe-area-inset-bottom, 0px));
        margin: 0;
        padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px));
      }
    }

    @keyframes startup-pulse {
      0% {
        background-position: 100% 0;
      }

      50% {
        background-position: -80% 0;
      }

      100% {
        background-position: 100% 0;
      }
    }
  </style>
</head>

<body>
  <div id="startup-shell" class="startup-shell" aria-hidden="true">
    <div class="startup-shell__content">

      <div class="startup-shell__list">
        <div class="startup-shell__row">
          <div class="startup-shell__avatar"></div>

            <div class="startup-shell__line"></div>

          </div>
        </div>
        <div class="startup-shell__row">
          <div class="startup-shell__avatar"></div>
          <div>
            <div class="startup-shell__line"></div>
            <div class="startup-shell__subline"></div>
          </div>
        </div>
        <div class="startup-shell__row">
          <div class="startup-shell__avatar"></div>
          <div>
            <div class="startup-shell__line"></div>
            <div class="startup-shell__subline"></div>
          </div>
        </div>
        <div class="startup-shell__row">
          <div class="startup-shell__avatar"></div>
          <div>
            <div class="startup-shell__line"></div>
            <div class="startup-shell__subline"></div>
          </div>
        </div>
        <div class="startup-shell__row">
          <div class="startup-shell__avatar"></div>
          <div>
            <div class="startup-shell__line"></div>
            <div class="startup-shell__subline"></div>
          </div>
        </div>
        <div class="startup-shell__row">
          <div class="startup-shell__avatar"></div>
          <div>
            <div class="startup-shell__line"></div>
            <div class="startup-shell__subline"></div>
          </div>
        </div>
        <div class="startup-shell__row">
          <div class="startup-shell__avatar"></div>
          <div>
            <div class="startup-shell__line"></div>
            <div class="startup-shell__subline"></div>
          </div>
        </div>
      </div>
      <div class="startup-shell__navigation">
        <div class="startup-shell__nav-item"></div>
        <div class="startup-shell__nav-item"></div>
        <div class="startup-shell__nav-item"></div>
      </div>
    </div>
    <main class="startup-shell__main">
      <div class="startup-shell__header">
        <div class="startup-shell__header-avatar"></div>
        <div class="startup-shell__header-profile">
          <div class="startup-shell__header-line"></div>
          <div class="startup-shell__header-subline"></div>

        <div class="startup-shell__header-actions">
          <div class="startup-shell__header-action"></div>

      <div class="startup-shell__messages">
        <div class="startup-shell__message-row">

        </div>
        <div class="startup-shell__message-row startup-shell__message-row--outgoing">
          <div class="startup-shell__message-bubble"></div>
        </div>
        <div class="startup-shell__message-row">
          <div class="startup-shell__message-avatar"></div>
          <div class="startup-shell__message-bubble startup-shell__message-bubble--wide"></div>
        </div>
        <div class="startup-shell__message-row startup-shell__message-row--outgoing">
          <div class="startup-shell__message-bubble"></div>

      </div>
      <div class="startup-shell__composer">
        <div class="startup-shell__composer-editor">
          <div class="startup-shell__composer-text"></div>
          <div class="startup-shell__composer-toolbar">
            <div class="startup-shell__composer-toolbar-button"></div>
            <div class="startup-shell__composer-toolbar-button"></div>
            <div class="startup-shell__composer-toolbar-button"></div>
            <div class="startup-shell__composer-toolbar-button"></div>

  <div id="app"></div>
  <script type="module" src="/src/bootstrap.ts"></script>

</html>
