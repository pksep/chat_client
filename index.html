<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#f8f9fd" />
    <title>SEP:Chat</title>
    <script>
      window.__chatNativeStartupCleanup = (async () => {
        const capacitor = window.Capacitor;
        const isAndroidNative =
          Boolean(capacitor?.isNativePlatform?.()) &&
          capacitor?.getPlatform?.() === 'android';

        if (!isAndroidNative) {
          return;
        }

        const tasks = [];

        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker
              .getRegistrations()
              .then(registrations =>
                Promise.allSettled(
                  registrations.map(registration => registration.unregister())
                )
              )
          );
        }

        if ('caches' in window) {
          tasks.push(
            caches
              .keys()
              .then(cacheNames =>
                Promise.allSettled(
                  cacheNames.map(cacheName => caches.delete(cacheName))
                )
              )
          );
        }

        await Promise.allSettled(tasks);
      })();
    </script>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
        background: #f8f9fd;
      }

      .startup-shell {
        min-height: 100dvh;
        background: #f8f9fd;
        color: #111827;
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        overflow: hidden;
      }

      .startup-shell__content {
        padding: 62px 16px 24px;
      }

      .startup-shell__title {
        width: 132px;
        height: 32px;
        margin-bottom: 24px;
        border-radius: 8px;
      }

      .startup-shell__search {
        height: 52px;
        margin-bottom: 14px;
        border-radius: 10px;
        background: #f5f7fb;
      }

      .startup-shell__filters {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .startup-shell__chip {
        width: 70px;
        height: 34px;
        border-radius: 18px;
        background: #eef4ff;
        border: 1px solid #d9e5ff;
      }

      .startup-shell__chip:nth-child(2) {
        width: 58px;
        background: #ffffff;
        border-color: #e5e7eb;
      }

      .startup-shell__chip:nth-child(3) {
        width: 96px;
        background: #ffffff;
        border-color: #e5e7eb;
      }

      .startup-shell__row {
        display: grid;
        grid-template-columns: 60px 1fr;
        column-gap: 16px;
        align-items: center;
        height: 82px;
      }

      .startup-shell__title,
      .startup-shell__avatar,
      .startup-shell__line,
      .startup-shell__subline {
        background: linear-gradient(90deg, #eef2f7, #f8fafc, #eef2f7);
        background-size: 180% 100%;
        animation: startup-pulse 1.2s ease-in-out infinite;
      }

      .startup-shell__avatar {
        width: 60px;
        height: 60px;
        border-radius: 50%;
      }

      .startup-shell__line {
        width: 78%;
        height: 20px;
        margin-bottom: 12px;
        border-radius: 6px;
      }

      .startup-shell__subline {
        width: 92%;
        height: 18px;
        border-radius: 6px;
      }

      @keyframes startup-pulse {
        0% {
          background-position: 100% 0;
        }

        100% {
          background-position: -80% 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="startup-shell" aria-hidden="true">
        <div class="startup-shell__content">
          <div class="startup-shell__title"></div>
          <div class="startup-shell__search"></div>
          <div class="startup-shell__filters">
            <div class="startup-shell__chip"></div>
            <div class="startup-shell__chip"></div>
            <div class="startup-shell__chip"></div>
          </div>
          <div class="startup-shell__row">
            <div class="startup-shell__avatar"></div>
            <div>
              <div class="startup-shell__line"></div>
              <div class="startup-shell__subline"></div>
            </div>
          </div>
          <div class="startup-shell__row">
            <div class="startup-shell__avatar"></div>
            <div>
              <div class="startup-shell__line"></div>
              <div class="startup-shell__subline"></div>
            </div>
          </div>
          <div class="startup-shell__row">
            <div class="startup-shell__avatar"></div>
            <div>
              <div class="startup-shell__line"></div>
              <div class="startup-shell__subline"></div>
            </div>
          </div>
          <div class="startup-shell__row">
            <div class="startup-shell__avatar"></div>
            <div>
              <div class="startup-shell__line"></div>
              <div class="startup-shell__subline"></div>
            </div>
          </div>
          <div class="startup-shell__row">
            <div class="startup-shell__avatar"></div>
            <div>
              <div class="startup-shell__line"></div>
              <div class="startup-shell__subline"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module">
      await window.__chatNativeStartupCleanup;
      await import('/src/main.ts');
    </script>
  </body>
</html>
