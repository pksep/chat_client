    <style>
      :root,
      .theme-light {
        --surface-main: #f8f9fd;
        --surface-input-primary: #ffffff;
        --surface-overlay: #ffffff;
        --border-table: #e7e7e7;
        --action-disabled-bg: #f5f5f5;
        --text-primary: #181818;
      }

      .theme-dark {
        --surface-main: #212531;
        --surface-input-primary: #262a38;
        --surface-overlay: #373d51;
        --border-table: #606884;
        --action-disabled-bg: rgba(245, 245, 245, 0.2);
        --text-primary: #ffffff;
      }

      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
        background: var(--surface-main);
        transition: all 0.2s ease;
      }

      .startup-shell {
        position: fixed;
        inset: 0;
        z-index: 2600;
        display: grid;
        grid-template-columns: 345px minmax(0, 1fr);
        height: 100dvh;
        min-height: 100dvh;
        background: var(--surface-main);
        color: #111827;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        overflow: hidden;
        opacity: 1;
        visibility: visible;
        transition:
          all 0.2s ease opacity 180ms ease,
          visibility 180ms ease;
      }

      .startup-shell--leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .startup-shell__content {
        display: grid;
        grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
        min-width: 0;
        min-height: 0;
        padding: 20px 10px 0;
        border-right: 0.5px solid var(--border-table);
        background: var(--surface-input-primary);
        box-sizing: border-box;
        transition: all 0.2s ease;
      }

      .startup-shell__toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 24px;
        padding: 0 16px 10px;
      }

      .startup-shell__title {
        width: 104px;
        height: 24px;
        border-radius: 6px;
      }

      .startup-shell__create {
        width: 22px;
        height: 22px;
        border-radius: 50%;
      }

      .startup-shell__divider {
        height: 1px;
        margin: 0 10px 10px;
        background: var(--surface-overlay);
        transition: all 0.2s ease;
      }

      .startup-shell__search {
        height: 40px;
        margin: 0 10px 10px;
        border-radius: 8px;
        background: var(--surface-overlay);
        transition: all 0.2s ease;
      }

      .startup-shell__filters {
        display: flex;
        gap: 5px;
        min-height: 43px;
        padding: 0 10px 10px;
        box-sizing: border-box;
      }

      .startup-shell__chip {
        width: 70px;
        height: 33px;
        border-radius: 15px;
        background: var(--surface-overlay);
        border: 1px solid var(--border-table);
        box-sizing: border-box;
        transition: all 0.2s ease;
      }

      .startup-shell__chip:nth-child(2) {
        width: 58px;
        background: var(--surface-input-primary);
        border-color: var(--border-table);
        transition: all 0.2s ease;
      }

      .startup-shell__chip:nth-child(3) {
        width: 96px;
        background: var(--surface-input-primary);
        border-color: var(--border-table);
        transition: all 0.2s ease;
      }

      .startup-shell__chip:nth-child(4) {
        width: 64px;
        background: var(--surface-input-primary);
        border-color: var(--border-table);
        transition: all 0.2s ease;
      }

      .startup-shell__list {
        min-height: 0;
        overflow: hidden;
      }

      .startup-shell__row {
        display: grid;
        grid-template-columns: 50px minmax(0, 1fr);
        column-gap: 10px;
        align-items: center;
        min-height: 60px;
        padding: 0 10px;
        box-sizing: border-box;
      }

      .startup-shell__title,
      .startup-shell__create,
      .startup-shell__avatar,
      .startup-shell__line,
      .startup-shell__subline,
      .startup-shell__nav-item,
      .startup-shell__header-avatar,
      .startup-shell__header-line,
      .startup-shell__header-subline,
      .startup-shell__header-action,
      .startup-shell__message-avatar,
      .startup-shell__message-bubble,
      .startup-shell__message-media,
      .startup-shell__message-media-icon,
      .startup-shell__composer-text,
      .startup-shell__composer-toolbar-button {
        background: linear-gradient(
          90deg,
          var(--border-table),
          var(--action-disabled-bg),
          var(--border-table)
        );
        background-size: 180% 100%;
        animation: startup-pulse 2.4s ease-in-out infinite;
        transition: all 0.2s ease;
      }

      .startup-shell__avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
      }

      .startup-shell__line {
        width: 78%;
        height: 14px;
        margin-bottom: 9px;
        border-radius: 6px;
      }

      .startup-shell__subline {
        width: 54%;
        height: 12px;
        border-radius: 6px;
      }

      .startup-shell__navigation {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        align-items: center;
        gap: 12px;
        height: 58px;
        margin: 0 -10px;
        padding: 10px 28px;
        border-top: 1px solid var(--border-table);
        border-radius: 15px 15px 0 0;
        box-shadow: 0 0 22px rgb(0 0 0 / 7%);
        box-sizing: border-box;
        transition: all 0.2s ease;
      }

      .startup-shell__nav-item {
        width: 38px;
        height: 38px;
        justify-self: center;
        border-radius: 50%;
      }

      .startup-shell__main {
        display: grid;
        grid-template-rows: 60px minmax(0, 1fr) auto;
        min-width: 0;
        min-height: 0;
      }

      .startup-shell__header {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 7px 16px;
        border-bottom: 0.5px solid var(--border-table);
        background: var(--surface-input-primary);
        box-sizing: border-box;
        transition: all 0.2s ease;
      }

      .startup-shell__header-avatar {
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
      }

      .startup-shell__header-avatar--label {
        display: grid;
        place-items: center;
        background: #4689f3;
        color: #ffffff;
        font-size: 17px;
        font-weight: 600;
        animation: none;
      }

      .startup-shell__header-profile {
        flex: 1;
        min-width: 0;
      }

      .startup-shell__header-line {
        width: 150px;
        height: 14px;
        margin-bottom: 6px;
        border-radius: 5px;
      }

      .startup-shell__header-line--label {
        width: min(220px, 58vw);
        height: auto;
        overflow: hidden;
        background: none;
        color: var(--text-primary, #111827);
        font-size: 15px;
        font-weight: 600;
        line-height: 18px;
        text-overflow: ellipsis;
        white-space: nowrap;
        animation: none;
      }

      .startup-shell__header-subline {
        width: 92px;
        height: 10px;
        border-radius: 5px;
      }

      .startup-shell__header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .startup-shell__header-action {
        width: 24px;
        height: 24px;
        border-radius: 50%;
      }

      .startup-shell__messages {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 12px;
        min-height: 0;
        padding: 22px 18px 16px;
        overflow: hidden;
        box-sizing: border-box;
      }

      .startup-shell__message-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        width: 100%;
      }

      .startup-shell__message-row--outgoing {
        justify-content: flex-end;
      }

      .startup-shell__message-avatar {
        display: none;
        flex: 0 0 35px;
        width: 35px;
        height: 35px;
        border-radius: 50%;
      }

      .startup-shell__messages--group .startup-shell__message-avatar {
        display: block;
      }

      .startup-shell__message-bubble {
        align-self: flex-start;
        width: min(58%, 340px);
        height: 42px;
        border-radius: 18px 18px 18px 6px;
      }

      .startup-shell__message-bubble--outgoing {
        align-self: flex-end;
        width: min(52%, 310px);
        border-radius: 18px 18px 6px 18px;
        background-color: var(--surface-overlay);
        transition: all 0.2s ease;
      }

      .startup-shell__message-bubble--short {
        width: min(40%, 230px);
      }

      .startup-shell__message-bubble--tiny {
        width: min(32%, 180px);
      }

      .startup-shell__message-bubble--wide {
        width: min(66%, 380px);
      }

      .startup-shell__message-media {
        align-self: flex-end;
        display: grid;
        place-items: center;
        width: min(55%, 340px);
        height: min(210px, 26vh);
        border-radius: 18px 18px 6px 18px;
      }

      .startup-shell__message-media-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
      }

      .startup-shell__composer {
        padding: 0 10px 15px 15px;
        box-sizing: border-box;
      }

      .startup-shell__composer-editor {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        min-height: 105px;
        border: 0.5px solid var(--border-table);
        border-radius: 20px;
        background: var(--surface-input-primary);
        box-sizing: border-box;
        transition: all 0.2s ease;
      }

      .startup-shell__composer-text {
        width: min(36%, 260px);
        height: 14px;
        margin: 20px 16px;
        border-radius: 5px;
      }

      .startup-shell__composer-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        margin: 0 16px 16px;
      }

      .startup-shell__composer-toolbar-button {
        width: 30px;
        height: 30px;
        border-radius: 7px;
      }

      .startup-shell__composer-toolbar-button:last-child {
        margin-left: auto;
        background-color: var(--surface-overlay);
        transition: all 0.2s ease;
      }

      .startup-shell__composer-live {
        display: none;
      }

      @media screen and (width <=768px) {
        .startup-shell {
          grid-template-columns: minmax(0, 1fr);
          height: 100dvh;
        }

        .startup-shell__content {
          display: grid;
          grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
          min-height: 100dvh;
          padding: 10px 0 0;
          border-right: 0;
          background: var(--surface-input-primary);
          transition: all 0.2s ease;
        }

        .startup-shell__toolbar {
          display: flex;
          min-height: 24px;
          padding: 0 16px 10px;
        }

        .startup-shell__title {
          width: 58px;
          height: 24px;
          margin: 0;
          border-radius: 6px;
        }

        .startup-shell__main {
          display: none;
        }

        html.startup-shell-topic-route .startup-shell__content {
          display: none;
        }

        html.startup-shell-topic-route .startup-shell__main {
          display: grid;
          grid-template-rows:
            60px minmax(0, 1fr)
            calc(75px + env(safe-area-inset-bottom, 0px));
          min-height: 100dvh;
          background: var(--surface-main);
          background-position: center top;
          background-repeat: repeat;
          background-size: 180px auto;
        }

        html.startup-shell-topic-route .startup-shell__messages {
          background-color: transparent;
          background-image: none;
          background-position: center top;
          background-repeat: repeat;
          background-size: 180px auto;
        }

        html.startup-shell-topic-route .startup-shell__messages {
          justify-content: space-between;
          gap: clamp(9px, 1.7vh, 16px);
          padding: clamp(10px, 2vh, 18px) 8px clamp(12px, 2.4vh, 22px);
        }

        html.startup-shell-topic-route .startup-shell__messages > :last-child {
          margin-bottom: clamp(44px, 7vh, 64px);
        }

        html.startup-shell-topic-route .startup-shell__message-bubble {
          width: min(72%, 320px);
          height: clamp(34px, 5.8vh, 46px);
        }

        html.startup-shell-topic-route
          .startup-shell__message-bubble--outgoing {
          width: min(64%, 300px);
        }

        html.startup-shell-topic-route .startup-shell__message-bubble--short {
          width: min(46%, 220px);
        }

        html.startup-shell-topic-route .startup-shell__message-bubble--tiny {
          width: min(38%, 180px);
        }

        html.startup-shell-topic-route .startup-shell__message-bubble--wide {
          width: min(78%, 340px);
          height: clamp(34px, 5.8vh, 46px);
        }

        html.startup-shell-topic-route .startup-shell__header-action {
          display: block;
        }

        html.startup-shell-topic-route
          .startup-shell__header-action:nth-child(3) {
          display: none;
        }

        html.startup-shell-topic-route .startup-shell__header-action svg {
          display: none;
        }

        html.startup-shell-topic-route .startup-shell__header-line {
          margin-bottom: 6px;
        }

        html.startup-shell-topic-route .startup-shell__header-subline {
          display: block;
        }

        .startup-shell__message-media {
          align-self: flex-end;
          display: grid;
          place-items: center;
          width: min(68%, 310px);
          height: clamp(112px, 18vh, 155px);
          border-radius: 18px 18px 6px 18px;
        }

        .startup-shell__message-media-icon {
          width: 42px;
          height: 42px;
          border-radius: 12px;
        }

        html.startup-shell-topic-route .startup-shell__composer {
          padding: 5px 10px calc(20px + env(safe-area-inset-bottom, 0px));
          background: transparent;
        }

        html.startup-shell-topic-route .startup-shell__composer-editor {
          display: grid;
          grid-template-columns: 22px minmax(0, 1fr) 22px;
          grid-template-rows: 1fr;
          align-items: center;
          gap: 10px;
          min-height: 50px;
          height: 50px;
          padding: 0 14px;
          border: 1px solid var(--border-table);
          border-radius: 30px;
          background: var(--surface-input-primary);
          animation: none;
        }

        html.startup-shell-topic-route .startup-shell__composer-text {
          display: block;
          grid-column: 2;
          grid-row: 1;
          width: min(42%, 150px);
          height: 14px;
          margin: 0;
        }

        html.startup-shell-topic-route .startup-shell__composer-toolbar {
          display: contents;
        }

        html.startup-shell-topic-route
          .startup-shell__composer-toolbar-button {
          display: none;
          width: 22px;
          height: 22px;
          margin: 0;
          border-radius: 50%;
        }

        html.startup-shell-topic-route
          .startup-shell__composer-toolbar-button:first-child,
        html.startup-shell-topic-route
          .startup-shell__composer-toolbar-button:last-child {
          display: block;
          grid-row: 1;
        }

        html.startup-shell-topic-route
          .startup-shell__composer-toolbar-button:first-child {
          grid-column: 1;
        }

        html.startup-shell-topic-route
          .startup-shell__composer-toolbar-button:last-child {
          grid-column: 3;
        }

        html.startup-shell-topic-route .startup-shell__composer-live {
          display: none;
        }

        html.startup-shell-topic-route .startup-shell__composer-live-icon {
          flex: 0 0 22px;
          width: 22px;
          height: 22px;
          color: #8d99aa;
          fill: none;
          stroke: currentcolor;
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke-width: 1.7;
        }

        html.startup-shell-topic-route .startup-shell__composer-placeholder {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          color: #8d99aa;
          font-size: 14px;
          line-height: 20px;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .startup-shell__divider {
          margin: 0 0 10px;
        }

        .startup-shell__search {
          height: 40px;
          margin: 0 16px 10px;
          border-radius: 8px;
        }

        .startup-shell__filters {
          gap: 5px;
          min-height: 43px;
          margin: 0;
          padding: 0 16px 10px;
        }

        .startup-shell__chip {
          width: 50px;
          height: 33px;
          border-radius: 15px;
        }

        .startup-shell__chip:nth-child(2) {
          width: 60px;
        }

        .startup-shell__chip:nth-child(3) {
          width: 78px;
        }

        .startup-shell__chip:nth-child(4) {
          width: 62px;
        }

        .startup-shell__row {
          grid-template-columns: 60px minmax(0, 1fr);
          column-gap: 10px;
          height: 82px;
          padding: 0 16px;
        }

        .startup-shell__row > div:last-child {
          display: grid;
          align-content: center;
          height: 100%;
          border-bottom: 1px solid var(--border-table);
          box-sizing: border-box;
          transition: all 0.2s ease;
        }

        .startup-shell__avatar {
          width: 60px;
          height: 60px;
        }

        .startup-shell__line {
          height: 20px;
          margin-bottom: 12px;
        }

        .startup-shell__subline {
          width: 92%;
          height: 18px;
        }

        .startup-shell__navigation {
          height: calc(58px + env(safe-area-inset-bottom, 0px));
          margin: 0;
          padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px));
        }
      }

      @keyframes startup-pulse {
        0% {
          background-position: 100% 0;
        }

        50% {
          background-position: -80% 0;
        }

        100% {
          background-position: 100% 0;
        }
      }
    </style>
  </head>

  <body>

        <div class="startup-shell__list">
          <div class="startup-shell__row">

            </div>

          <div class="startup-shell__row">

            </div>
          </div>
          <div class="startup-shell__row">
            <div class="startup-shell__avatar"></div>

              <div class="startup-shell__subline"></div>

        <div class="startup-shell__navigation">

        </div>
      </div>
      <main class="startup-shell__main">
        <div class="startup-shell__header">
          <div class="startup-shell__header-avatar"></div>

          <div class="startup-shell__message-row">
            <div class="startup-shell__message-avatar"></div>
            <div class="startup-shell__message-bubble"></div>
          </div>
          <div
            class="startup-shell__message-bubble startup-shell__message-bubble--outgoing startup-shell__message-bubble--wide"
          ></div>
          <div class="startup-shell__message-row">
