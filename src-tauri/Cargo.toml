[package]
name = "sep-chat"
version = "1.6.0"
description = "СЭП Чат desktop application"
authors = ["PKSEP"]
edition = "2021"

[lib]
name = "sep_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false

[[bin]]
name = "sep-chat"
path = "src/main.rs"
test = false

[[test]]
name = "desktop_files"
path = "tests/desktop_files.rs"

[[test]]
name = "desktop_auth"
path = "tests/desktop_auth.rs"

[[test]]
name = "desktop_recovery"
path = "tests/desktop_recovery.rs"

[[test]]
name = "desktop_autostart"
path = "tests/desktop_autostart.rs"

[[test]]
name = "desktop_vpn"
path = "tests/desktop_vpn.rs"

[[test]]
name = "desktop_notifications"
path = "tests/desktop_notifications.rs"

[[test]]
name = "desktop_screen_capture"
path = "tests/desktop_screen_capture.rs"

[[test]]
name = "desktop_permission_preferences"
path = "tests/desktop_permission_preferences.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"

[target.'cfg(windows)'.dependencies]
windows-capture = "=1.5.0"
tauri-winrt-notification = "0.7.2"
winreg = "0.55"
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation", "Foundation_Collections", "UI_Notifications", "Win32_Security_Cryptography", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKPreferences"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }
cidre = { version = "=0.10.1", default-features = false, features = ["async", "av", "sc", "dispatch", "macos_12_3"] }
futures = "0.3"
